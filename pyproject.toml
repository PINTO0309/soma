[project]
name = "soma"
version = "1.0.0"
description = "SOMA — Structured Output Matching & Association: online multi-person tracking on the structured output of a multi-task wholebody detector"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
# NOTE: pinned exactly, mirroring the ptrack research repo the tracker was
# validated in. The tracking core itself needs numpy only; opencv is video
# I/O + preprocessing, onnxruntime-gpu runs the ONNX models, scipy is the
# evaluator's linear_sum_assignment (the tracker falls back to a built-in
# numpy Hungarian when scipy is absent).
dependencies = [
    "numpy==2.4.6",
    "opencv-python==4.13.0.92",
    "onnxruntime-gpu==1.26.0",
    "scipy==1.16.2",
]

[project.optional-dependencies]
tensorrt = [
    "tensorrt-cu12==11.1.0.106",
]
dev = [
    "pytest==8.4.2",
    "ruff==0.15.22",
]

[project.scripts]
soma-eval = "soma.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["soma"]

[tool.ruff]
line-length = 100
